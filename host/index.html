<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group 2 · Ticket guidance</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0d1f35;
      --navy-light: #1e293b;
      --blue:       #1461bb;
      --blue-soft:  #edf4fc;
      --green:      #15803d;
      --green-soft: #f0fdf4;
      --amber:      #d97706;
      --amber-soft: #fffbeb;
      --red:        #dc2626;
      --red-soft:   #fef2f2;
      --white:      #ffffff;
      --slate-50:   #f8fafc;
      --slate-100:  #f1f5f9;
      --slate-200:  #e2e8f0;
      --slate-300:  #cbd5e1;
      --slate-600:  #475569;
      --slate-800:  #1e293b;
      --radius:     16px;
      --shadow:     0 4px 20px rgba(13, 31, 53, 0.08);
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--slate-50);
      color: var(--navy);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      background: var(--navy);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 64px;
      flex-shrink: 0;
      gap: 16px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      width: 36px;
      height: 36px;
      background: var(--blue);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-logo svg {
      width: 20px;
      height: 20px;
      fill: var(--white);
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .header-statuses {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Reader Status Badge */
    .reader-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
      white-space: nowrap;
    }

    /* Network Status Pill */
    #network {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
      transition: background 0.3s;
      white-space: nowrap;
    }

    #network::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--slate-300);
      transition: background 0.3s;
    }

    #network[data-ok="true"] { background: rgba(34, 197, 94, 0.22); }
    #network[data-ok="true"]::before { background: #4ade80; }
    #network[data-ok="false"] { background: rgba(239, 68, 68, 0.25); }
    #network[data-ok="false"]::before { background: #f87171; }

    /* ── Main Unified Kiosk View ──────────────────────────────────── */
    main {
      flex: 1;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .kiosk-card {
      width: 100%;
      max-width: 960px;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 28px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Heading */
    .kiosk-header {
      text-align: center;
    }

    .kiosk-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.4px;
      line-height: 1.15;
    }

    .kiosk-subtitle {
      font-size: 0.92rem;
      color: var(--slate-600);
      margin-top: 4px;
    }

    /* ── SVG Seating Map ──────────────────────────────────────────── */
    .map-container {
      width: 100%;
      display: flex;
      justify-content: center;
      background: var(--slate-50);
      border-radius: 12px;
      border: 1px solid var(--slate-200);
      padding: 8px;
    }

    svg {
      width: 100%;
      max-width: 740px;
      height: auto;
      max-height: 48vh;
      display: block;
    }

    .seat-group {
      cursor: default;
    }

    .seat-rect {
      fill: var(--white);
      stroke: var(--slate-300);
      stroke-width: 2;
      transition: fill 0.2s, stroke 0.2s;
    }

    /* Highlighted Seat */
    rect.selected {
      fill: #ffe172 !important;
      stroke: var(--navy) !important;
      stroke-width: 3 !important;
    }

    /* Route Path */
    #route {
      fill: none;
      stroke: var(--blue);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 10 6;
    }

    /* ── Legend ───────────────────────────────────────────────────── */
    .map-legend {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 0.82rem;
      color: var(--slate-600);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .legend-swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .legend-swatch.route {
      background: var(--blue);
      border-radius: 999px;
      height: 4px;
      width: 22px;
    }

    /* ── Status & Action Bar ──────────────────────────────────────── */
    .guide-card {
      border-radius: 12px;
      border: 2px solid var(--slate-200);
      border-left: 6px solid var(--slate-300);
      padding: 12px 18px;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color 0.3s, background 0.3s;
    }

    .guide-card[data-state="ready"]   { border-left-color: var(--blue);  background: var(--blue-soft); }
    .guide-card[data-state="success"] { border-left-color: var(--green); background: var(--green-soft); }
    .guide-card[data-state="unknown"] { border-left-color: var(--amber); background: var(--amber-soft); }
    .guide-card[data-state="error"]   { border-left-color: var(--red);   background: var(--red-soft); }

    .guide-content {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .guide-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .guide-col.status-col {
      flex: 1.2;
    }

    .guide-col.action-col {
      flex: 1.4;
    }

    .guide-label, .next-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--slate-600);
    }

    #guide {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--navy);
    }

    #next-action {
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--slate-600);
    }

    .guide-divider {
      width: 1px;
      height: 36px;
      background: var(--slate-300);
      flex-shrink: 0;
    }

    /* Clear Button — Warm Amber color, completely distinct from dark stage */
    #clear-ticket {
      background: var(--amber);
      color: var(--white);
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font: 700 0.95rem system-ui, sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.28);
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      min-height: 48px;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    #clear-ticket:hover { background: #b45309; }
    #clear-ticket:active { transform: scale(0.97); }
    #clear-ticket:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
    #clear-ticket .btn-icon { font-size: 1.15em; }

    /* ── Footer ───────────────────────────────────────────────────── */
    footer {
      text-align: center;
      font-size: 0.76rem;
      color: var(--slate-600);
      padding: 8px 16px 12px;
    }
  </style>
</head>
<body>

  <!-- ── JavaScript (runs in browser) ────────────────────────────── -->
  <script>
    // Remember the exact host scan that the user cleared on this browser.
    let latestTicketTime = null;
    let clearedTicketTime = null;
    let currentState = null;
    let hostAvailable = false;

    function removeRoute() {
      document.getElementById('route').setAttribute('d', '');
      const selectedSeats = document.querySelectorAll('.selected');
      for (const seat of selectedSeats) {
        seat.classList.remove('selected');
      }
    }

    function clearTicket() {
      clearedTicketTime = latestTicketTime;
      if (hostAvailable && currentState !== null) {
        showTicket(currentState);
      } else {
        showHostError();
      }
    }
    document.getElementById('clear-ticket').addEventListener('click', clearTicket);

    function drawRoute(seatId) {
      const seat = document.getElementById('seat-' + seatId);
      if (seat === null) {
        return;
      }
      seat.classList.add('selected');
      // Number converts an HTML attribute (text) into a number for arithmetic.
      // Each seat is 76px wide and 40px high. Center offset is +38 and +20.
      const centreX = Number(seat.getAttribute('x')) + 38;
      const centreY = Number(seat.getAttribute('y')) + 20;

      // Route starts at Entrance (280, 295), moves up the center aisle at x=280,
      // and turns directly into the target seat. It never overlaps any other seat!
      const route = 'M 280 295 L 280 ' + centreY + ' L ' + centreX + ' ' + centreY;
      document.getElementById('route').setAttribute('d', route);
    }

    function setGuideState(state) {
      const card = document.getElementById('guide-card');
      if (card) {
        card.setAttribute('data-state', state);
      }
    }

    function setReaderIcon(type) {
      const icon = document.getElementById('reader-icon');
      if (!icon) { return; }
      const map = { ok: '✅', warn: '⚠️', error: '❌' };
      icon.textContent = map[type] || '📡';
    }

    function showTicket(state) {
      currentState = state;
      hostAvailable = true;
      removeRoute(); // Never retain the previous visitor's destination.
      let message = 'Ticket scanning is unavailable.';
      let readerMessage = 'Reader offline / unknown';
      let nextAction = 'Ask an organiser to check Arduino power and its connection to IFI7386-G2. Scan again when the reader is online.';
      setGuideState('error');
      setReaderIcon('error');

      if (state.reader.online) {
        if (state.reader.ready) {
          readerMessage = 'Reader initialised; scan a card to check.';
          message = 'Ready for a ticket.';
          nextAction = 'Hold one ticket card near the reader. Remove it before scanning again.';
          setGuideState('ready');
          setReaderIcon('ok');
        } else {
          readerMessage = 'Reader error reported';
          nextAction = 'Ask an organiser to check the reader and restart it. Try your ticket again when it is ready.';
          setGuideState('error');
          setReaderIcon('warn');
        }
      }
      document.getElementById('reader').textContent = readerMessage;
      latestTicketTime = null;
      if (state.ticket !== null) {
        latestTicketTime = state.ticket.at;
        if (state.ticket.at !== clearedTicketTime && state.reader.online && state.reader.ready) {
          if (state.ticket.known) {
            message = 'Seat ' + state.ticket.seat + '. ' + state.ticket.route;
            nextAction = 'Follow the highlighted route to seat ' + state.ticket.seat + '. Clear the display for the next visitor.';
            drawRoute(state.ticket.seat);
            setGuideState('success');
          } else {
            message = 'Unknown ticket. Please ask an organiser.';
            nextAction = 'No seat is assigned to this ticket. Ask an organiser to check it before entering.';
            setGuideState('unknown');
          }
        }
      }
      document.getElementById('guide').textContent = message;
      document.getElementById('next-action').textContent = nextAction;
    }

    function showHostError() {
      hostAvailable = false;
      const net = document.getElementById('network');
      net.textContent = 'Host unavailable. Check Wi-Fi and server.';
      net.setAttribute('data-ok', 'false');
      document.getElementById('reader').textContent = 'Reader status unknown';
      document.getElementById('guide').textContent = 'Ticket guidance is unavailable.';
      document.getElementById('next-action').textContent = 'Ask an organiser to restore the Pi hotspot and restart the server. Wait for Host connected, then scan your ticket again.';
      setGuideState('error');
      setReaderIcon('error');
      removeRoute();
    }

    async function refresh() {
      try {
        const response = await fetch('/api/state', { signal: AbortSignal.timeout(2500) });
        if (!response.ok) {
          throw new Error('Host returned an error');
        }
        const state = await response.json();
        const net = document.getElementById('network');
        net.textContent = 'Host connected';
        net.setAttribute('data-ok', 'true');
        showTicket(state);
      } catch (error) {
        showHostError();
      } finally {
        setTimeout(refresh, 1000);
      }
    }
    refresh();
  </script>
</body>
</html>
